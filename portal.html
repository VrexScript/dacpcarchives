<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DACPC Internal Portal</title>

<link rel="stylesheet" href="css/style.css">

</head>


<body>


<div class="loading-screen" id="loading">

    <h2 id="loadingText">
        VERIFYING CREDENTIALS...
    </h2>

</div>




<div class="security-popup hidden" id="securityPopup">


    <div class="popup-box">


        <h2>
            ⚠ SECURITY ALERT
        </h2>


        <p>
            The Security Systems have flagged your system
            as an unauthorized access attempt.
        </p>


        <p>
            To continue, please provide the
            <b>IN PERSONNEL TOKEN</b>.
        </p>


        <input 
        type="password"
        id="tokenInput"
        placeholder="Enter Personnel Token">


        <button onclick="verifyToken()">
            VERIFY
        </button>


        <p id="tokenResult"></p>


    </div>


</div>






<div class="portal hidden" id="portal">


<h1>
DACPC INTERNAL WEBPORTAL
</h1>


<p>
ACCESS LEVEL: PENDING
</p>


</div>






<script>


let loadingText = document.getElementById("loadingText");


setTimeout(() => {

    loadingText.innerHTML =
    "CONTACTING DACPC SERVERS...";

}, 2500);



setTimeout(() => {

    document.getElementById("loading").style.display="none";

    document.getElementById("securityPopup")
    .classList.remove("hidden");


}, 5000);





function verifyToken(){


    let token =
    document.getElementById("tokenInput").value;


    if(token === "112010"){


        document.getElementById("securityPopup")
        .style.display="none";


        document.getElementById("portal")
        .classList.remove("hidden");


    }


  else{


let attempts = localStorage.getItem("attempts");


if(attempts === null){

    attempts = 3;

}


attempts--;


localStorage.setItem("attempts", attempts);



if(attempts > 0){


document.getElementById("tokenResult")
.innerHTML = `

<p style="color:red">

WARNING:
WRONG IN PERSONNEL TOKEN

</p>


<p>

You have ${attempts} more tries left before
the control panel locks access to your system.

</p>


<p>

Note:
If you believe this is a glitch,
please contact the authorities manually.

</p>

`;



}

else{


document.getElementById("tokenResult")
.innerHTML = `


<p style="color:red">

ACCESS LOCKED

</p>


<p>

Maximum authentication attempts exceeded.

DACPC Servers have locked your access to the terminal. Please contact authorities if the problem persists. 

</p>


`;


}

}

}



</script>



</body>

</html>
